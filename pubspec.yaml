name: qulex
description: "Qulex — a timed vocabulary quiz game (MVP base)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  supabase_flutter: ^2.5.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  speech_to_text: ^7.0.0
  home_widget: ^0.6.0
  # Pure-Dart, no platform channels — which matters: Shorebird can patch
  # pure-Dart code over the air but cannot patch a new native dependency into
  # an already-released binary. Used by CatalogueOta to verify a downloaded
  # word list against the SHA-256 in its manifest.
  crypto: ^3.0.3
  convert: ^3.1.1
  # Joining and comparing filesystem paths. Direct, not transitive, because
  # CatalogueOta depends on it for correctness rather than convenience — see
  # the note above _payloadName().
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/words.json
    - assets/backgrounds/
    - shorebird.yaml

  # Bundled, not downloaded. google_fonts fetched these from fonts.gstatic.com
  # on first use, so a cold start rendered in Roboto until the download landed
  # and an offline first launch never got them at all. These are the same files.
  fonts:
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Medium.ttf
          weight: 500
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Spectral-Italic.ttf
          weight: 400
          style: italic
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/qulex_icon_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/qulex_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/qulex_icon_fg.png"
  min_sdk_android: 21
